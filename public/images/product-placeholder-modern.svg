<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cbd5e1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#94a3b8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="500" fill="url(#grad1)"/>
  
  <!-- Image box outline -->
  <rect x="40" y="40" width="320" height="320" fill="white" stroke="#cbd5e1" stroke-width="2" rx="8"/>
  
  <!-- Camera/Image icon -->
  <g transform="translate(200, 160)">
    <!-- Camera body -->
    <rect x="-50" y="-30" width="100" height="70" fill="none" stroke="#94a3b8" stroke-width="2" rx="4"/>
    <!-- Camera lens -->
    <circle cx="0" cy="10" r="25" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="0" cy="10" r="18" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <!-- Viewfinder -->
    <circle cx="0" cy="10" r="12" fill="#f1f5f9" opacity="0.5"/>
  </g>
  
  <!-- Mountains/Product hint -->
  <g transform="translate(200, 200)" opacity="0.6">
    <path d="M -60 40 L -20 0 L 20 20 L 60 -10 L 60 40 Z" fill="url(#grad2)" stroke="#94a3b8" stroke-width="1"/>
    <!-- Sun -->
    <circle cx="40" cy="-20" r="8" fill="#f59e0b" opacity="0.6"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="400" font-family="Poppins, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#64748b">
    No Image Available
  </text>
  <text x="200" y="425" font-family="Poppins, sans-serif" font-size="12" text-anchor="middle" fill="#94a3b8">
    Product image coming soon
  </text>
</svg>
